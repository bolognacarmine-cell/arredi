name: Mantieni attivo Farcom

on:
  schedule:
    # GitHub Actions usa sempre UTC: ogni 10 minuti, 24/7.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Keep-alive Farcom
        run: |
          curl --location \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 120 \
            --output /dev/null \
            --write-out 'keep-alive HTTP %{http_code} - %{time_total}s\n' \
            https://www.farcomarredi.it/api/keep-alive

      - name: Verifica sitemap
        run: |
          curl --location \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 120 \
            --output /dev/null \
            --write-out 'sitemap HTTP %{http_code} - type %{content_type} - %{time_total}s\n' \
            https://www.farcomarredi.it/sitemap.xml
