name: Mantieni attivo Farcom

on:
  schedule:
    - cron: "3,13,23,33,43,53 8-21 * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Richiesta keep-alive a Farcom
        run: |
          curl --location \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 20 \
            --max-time 120 \
            --output /dev/null \
            --write-out 'HTTP %{http_code} - Tempo: %{time_total}s\n' \
            https://farcomarredi.it/api/keep-alive
